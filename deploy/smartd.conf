# smartd.conf: Monitor single 500 GB spinning HDD for Devi Electrical
# -a: monitor all standard SMART attributes
# -o on: enable automatic offline testing
# -S on: enable attribute autosave
# -s: schedule short self-test every Sunday at 3am, long self-test 1st of month at 4am
# -W 4,45,55: report temperature changes >= 4 C, warn at 45 C, critical at 55 C
# -m <admin-email> or log warning
/dev/sda -a -o on -S on -s (S/../../7/03|L/../01/04) -W 4,45,55 -M exec /usr/share/smartmontools/smartd-runner
